<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span>Prices</span>
    <span class="actions">
      <button id="add-btn" title="Add coin">+</button>
      <button id="quit-btn" title="Quit">✕</button>
    </span>
  </header>
  <div id="search" hidden>
    <input id="search-input" placeholder="Search coin, e.g. SOL" autocomplete="off" />
    <div id="results"></div>
  </div>
  <div id="list"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
